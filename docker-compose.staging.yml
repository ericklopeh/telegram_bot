# Staging / VPS — Sistema Gaman (P30)
# Uso: docker compose -f docker-compose.staging.yml --env-file .env up -d
# Desarrollo local sigue en docker-compose.yml (bind mount ./, puerto WEB_HOST_PORT).

services:
  db:
    image: postgres:16
    container_name: gaman_staging_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data_staging:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - gaman_net

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: gaman_staging_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      WEB_DEBUG: "false"
      WEB_RBAC_RELAXED: ${WEB_RBAC_RELAXED:-false}
      TELEGRAM_DEV_FALLBACK_ANY_SENDER: "false"
      BASE_STORAGE_PATH: /app/storage
      STORAGE_ROOT: /app/storage
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose:
      - "8000"
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - gaman_net

  nginx:
    image: nginx:1.27-alpine
    container_name: gaman_staging_nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - gaman_net

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gaman_staging_bot
    restart: unless-stopped
    profiles:
      - with-bot
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      TELEGRAM_DEV_FALLBACK_ANY_SENDER: "false"
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
    command: python -m app.main
    networks:
      - gaman_net

volumes:
  pg_data_staging:

networks:
  gaman_net:
    driver: bridge
