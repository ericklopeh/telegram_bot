# Despliegue manual a staging (P72) — solo workflow_dispatch, secrets en GitHub.
name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Rama o tag a desplegar en el servidor
        required: true
        default: feature/web-demo
      dry_run:
        description: Solo validar y ejecutar tests (sin SSH deploy)
        type: boolean
        default: false

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  validate-and-test:
    name: Validar secrets y tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gaman_test
          POSTGRES_USER: gaman
          POSTGRES_PASSWORD: gaman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gaman -d gaman_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TELEGRAM_BOT_TOKEN: ci-token-placeholder
      DATABASE_URL: postgresql+psycopg://gaman:gaman_test@localhost:5432/gaman_test
      WEB_SESSION_SECRET: ci-secret-minimum-32-characters-long
      ENVIRONMENT: test
      WEB_DEBUG: "false"
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      STAGING_APP_PATH: ${{ secrets.STAGING_APP_PATH }}
      STAGING_URL: ${{ secrets.STAGING_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate required GitHub Secrets
        if: ${{ inputs.dry_run == false }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: chmod +x scripts/ci_validate_staging_deploy.sh && ./scripts/ci_validate_staging_deploy.sh

      - name: Skip secret check (dry run)
        if: ${{ inputs.dry_run == true }}
        run: echo "dry_run=true — omitiendo validación SSH (solo tests/build)"

      - name: Create temporary .env for Docker Compose validation
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          printf '%s\n' \
            'POSTGRES_USER=test' \
            'POSTGRES_PASSWORD=test' \
            'POSTGRES_DB=test' \
            'DATABASE_URL=postgresql://test:test@db:5432/test' \
            'TELEGRAM_BOT_TOKEN=dummy_ci_token' \
            'WEB_SESSION_SECRET=dummy_ci_secret' \
            > .env

      - name: Validate staging compose
        working-directory: ${{ github.workspace }}
        run: docker compose --env-file .env -f docker-compose.staging.yml config -q

      - name: Validate Docker build (web)
        working-directory: ${{ github.workspace }}
        run: docker build -f Dockerfile.web -t gaman-web:staging-ci .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-web.txt

      - name: Install dependencies and run pytest
        working-directory: ${{ github.workspace }}
        run: |
          pip install --upgrade pip
          pip install -r requirements-web.txt pytest
          python -m pytest -q

  deploy-staging:
    name: Deploy SSH + smoke health
    needs: validate-and-test
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest
    environment: staging

    env:
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      STAGING_APP_PATH: ${{ secrets.STAGING_APP_PATH }}
      STAGING_URL: ${{ secrets.STAGING_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Re-validate secrets before deploy
        working-directory: ${{ github.workspace }}
        run: chmod +x scripts/ci_validate_staging_deploy.sh && ./scripts/ci_validate_staging_deploy.sh

      - name: Deploy to staging server via SSH
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          chmod +x scripts/gh_deploy_staging_remote.sh
          ./scripts/gh_deploy_staging_remote.sh "${{ inputs.git_ref }}"

      - name: Smoke health on staging URL
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          chmod +x scripts/smoke_health.sh
          ./scripts/smoke_health.sh "${STAGING_URL}"

      - name: Deploy summary
        run: |
          echo "Staging deploy OK — ref: ${{ inputs.git_ref }}"
          echo "Health: ${STAGING_URL}/health"
