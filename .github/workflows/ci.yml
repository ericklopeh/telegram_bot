name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gaman_test
          POSTGRES_USER: gaman
          POSTGRES_PASSWORD: gaman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gaman -d gaman_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TELEGRAM_BOT_TOKEN: ci-token-placeholder
      DATABASE_URL: postgresql+psycopg://gaman:gaman_test@localhost:5432/gaman_test
      WEB_SESSION_SECRET: ci-secret-minimum-32-characters-long
      ENVIRONMENT: test
      WEB_DEBUG: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Create temporary .env for Docker Compose
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          printf '%s\n' \
            'POSTGRES_USER=test' \
            'POSTGRES_PASSWORD=test' \
            'POSTGRES_DB=test' \
            'DATABASE_URL=postgresql://test:test@db:5432/test' \
            'TELEGRAM_BOT_TOKEN=dummy_ci_token' \
            'WEB_SESSION_SECRET=dummy_ci_secret' \
            > .env
          pwd
          ls -la
          ls -la .env
          cat .env

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-web.txt

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: |
          pip install --upgrade pip
          pip install -r requirements-web.txt
          pip install pytest ruff

      - name: Lint (ruff check)
        working-directory: ${{ github.workspace }}
        run: ruff check app tests --ignore E501 || true

      - name: Validate compose files
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          pwd
          ls -la
          ls -la .env
          cat .env
          docker compose --env-file .env -f docker-compose.yml config -q
          docker compose --env-file .env -f docker-compose.staging.yml config -q
          docker compose --env-file .env -f docker-compose.prod.yml config -q

      - name: Alembic heads
        working-directory: ${{ github.workspace }}
        run: python -m alembic heads

      - name: Pytest
        working-directory: ${{ github.workspace }}
        run: python -m pytest -q

      - name: Production config smoke
        working-directory: ${{ github.workspace }}
        run: python scripts/go_live_check.py || true
