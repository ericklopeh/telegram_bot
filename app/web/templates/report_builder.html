{% extends "base.html" %}
{% block title %}Constructor de reportes{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Constructor de reportes</h1>
<form method="post" action="/reports/run" class="card p-3">
  <select name="source" class="form-select mb-2">
    {% for key in sources %}
    <option value="{{ key }}">{{ key }}</option>
    {% endfor %}
  </select>
  <input class="form-control mb-2" name="columns" value="public_id,client_name,current_status">
  <button class="btn btn-primary" type="submit">Exportar CSV</button>
</form>
<p class="mt-3"><a href="/reports/saved">Reportes guardados</a></p>
{% endblock %}
