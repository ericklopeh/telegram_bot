<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Acceder · Sistema Gaman</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/gaman-ui.css">

    <style>
        html, body { margin: 0; padding: 0; }
    </style>

    <script>
      (function() {
        var saved = localStorage.getItem("gaman-theme");
        var pref  = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", saved || pref);
      })();
    </script>
</head>

<body>
<div class="g-login-wrap">
    <!-- Background decorative blobs -->
    <div aria-hidden="true" style="position:absolute;inset:0;overflow:hidden;pointer-events:none">
        <div style="position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.18) 0%,transparent 70%);top:-200px;left:-200px"></div>
        <div style="position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.12) 0%,transparent 70%);bottom:-150px;right:-100px"></div>
    </div>

    <div class="g-login-card">
        <!-- Brand -->
        <div class="g-login-brand">
            <div class="g-login-brand__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
            <div>
                <div class="g-login-brand__name">Sistema Gaman</div>
                <div class="g-login-brand__sub">Plataforma operacional</div>
            </div>
        </div>

        <h2 class="g-login-title">Bienvenido</h2>
        <p class="g-login-sub">Ingresa tus credenciales para continuar</p>

        {% if error %}
        <div class="g-login-error">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/login" id="loginForm">
            <div>
                <label class="g-login-label">Usuario</label>
                <input
                    class="g-login-input"
                    type="text"
                    name="username"
                    autocomplete="username"
                    placeholder="tu_usuario"
                    required
                    autofocus
                >
            </div>

            <div>
                <label class="g-login-label">Contraseña</label>
                <input
                    class="g-login-input"
                    type="password"
                    name="password"
                    autocomplete="current-password"
                    placeholder="••••••••"
                    required
                >
            </div>

            <button class="g-login-btn" type="submit" id="loginBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                Entrar
            </button>
        </form>

        <hr class="g-login-divider">

        <div class="g-login-demo">
            <strong>Usuarios demo</strong> — crear con
            <code>python scripts/seed_web_demo_users.py</code> dentro del contenedor <code>web</code><br><br>
            admin / Admin2026! &nbsp;·&nbsp; jefe / Jefe2026! &nbsp;·&nbsp; vendedor / Vend2026!
        </div>
    </div>
</div>

<script src="/static/js/gaman-ui.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", function() {
    var btn = document.getElementById("loginBtn");
    btn.disabled = true;
    btn.innerHTML = '<span class="g-spinner g-spinner--sm g-spinner--white"></span> Ingresando…';
});
</script>
</body>
</html>
