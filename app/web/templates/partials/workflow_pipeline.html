{% if workflow_pipeline %}
<section class="dash-card mb-3">
    <div class="dash-card__header">
        <div>
            <h3 class="dash-panel__title" style="font-size:.95rem">Flujo operativo</h3>
            <span class="dash-panel__sub">Estado: <strong>{{ workflow_pipeline.current_label }}</strong></span>
        </div>
        {% if can_recalc_workflow %}
        <form method="post" action="/casos/{{ caso.id }}/recalcular-estado" class="m-0">
            <button type="submit" class="g-btn g-btn--ghost g-btn--sm">Recalcular</button>
        </form>
        {% endif %}
    </div>
    <div class="dash-card__body" style="padding-top:.5rem">
        <div class="d-flex flex-wrap gap-2 align-items-center">
            {% for step in workflow_pipeline.steps %}
            <div class="g-badge g-badge--{{ step.status|default('neutral') }}" style="font-size:.72rem; padding:4px 9px;">
                {{ step.label }}
            </div>
            {% if not loop.last %}<span style="color:#94a3b8; font-size:.75rem;">→</span>{% endif %}
            {% endfor %}
        </div>
    </div>
</section>
{% endif %}
