# Producción VPS — Sistema Gaman (P70)
# Uso:
#   cp .env.example .env   # completar secretos
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#   docker compose -f docker-compose.prod.yml --profile with-redis --profile with-worker up -d

services:
  db:
    image: postgres:16
    container_name: gaman_prod_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 25s
    networks:
      - gaman_internal

  redis:
    image: redis:7-alpine
    container_name: gaman_prod_redis
    restart: always
    profiles: ["with-redis"]
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - gaman_internal

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: gaman_prod_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      ENVIRONMENT: production
      WEB_DEBUG: "false"
      WEB_RBAC_RELAXED: "false"
      TELEGRAM_DEV_FALLBACK_ANY_SENDER: "false"
      BASE_STORAGE_PATH: /app/storage
      STORAGE_ROOT: /app/storage
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JOBS_ASYNC_ENABLED: "true"
    expose:
      - "8000"
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - gaman_internal

  worker:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: gaman_prod_worker
    restart: always
    profiles: ["with-worker"]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      ENVIRONMENT: production
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WORKER_MODE: "1"
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
    command: python -m app.workers.worker_main
    networks:
      - gaman_internal

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: gaman_prod_scheduler
    restart: always
    profiles: ["with-worker"]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      ENVIRONMENT: production
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SCHEDULER_ENABLED: "true"
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
    command: python -m app.workers.scheduler_main
    networks:
      - gaman_internal

  nginx:
    image: nginx:1.27-alpine
    container_name: gaman_prod_nginx
    restart: always
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/app.prod.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - gaman_internal

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gaman_prod_bot
    restart: always
    profiles: ["with-bot"]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      ENVIRONMENT: production
      TELEGRAM_DEV_FALLBACK_ANY_SENDER: "false"
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
    command: python -m app.main
    networks:
      - gaman_internal

volumes:
  pg_data_prod:
  redis_data_prod:

networks:
  gaman_internal:
    driver: bridge
