# Configuración de logging P30 — cargada por app/core/logging_setup.py
version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s %(levelname)s [%(name)s] [%(correlation_id)s] %(message)s action=%(action)s entity=%(entity_type)s:%(entity_id)s result=%(result)s elapsed_ms=%(elapsed_ms)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  simple:
    format: "%(asctime)s %(levelname)s [%(name)s] %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

filters:
  request_id:
    (): app.core.logging_setup.RequestIdFilter

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stderr

  app_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: logs/app.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8
    filters: [request_id]

  sharepoint_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: logs/sharepoint.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8
    filters: [request_id]

  workflow_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: logs/workflow.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8
    filters: [request_id]

  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: standard
    filename: logs/errors.log
    maxBytes: 10485760
    backupCount: 10
    encoding: utf-8
    filters: [request_id]

loggers:
  app:
    level: INFO
    handlers: [console, app_file, error_file]
    propagate: false
  app.services.sharepoint_graph_client:
    level: INFO
    handlers: [sharepoint_file, error_file]
    propagate: false
  app.services.sharepoint_sync_service:
    level: INFO
    handlers: [sharepoint_file, error_file]
    propagate: false
  app.services.workflow_transition_service:
    level: INFO
    handlers: [workflow_file, error_file]
    propagate: false
  app.services.workflow_dependency_service:
    level: INFO
    handlers: [workflow_file, error_file]
    propagate: false
  uvicorn:
    level: INFO
    handlers: [console, app_file]
    propagate: false
  uvicorn.error:
    level: INFO
    handlers: [console, error_file]
    propagate: false

root:
  level: INFO
  handlers: [console, app_file, error_file]
